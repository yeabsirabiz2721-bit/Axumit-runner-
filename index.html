  <!DOCTYPE html>
<html>
<head>
  <title>Axumit Runner</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// GAME VARIABLES
let gameState = "start";
let player = { x: canvas.width / 2, y: canvas.height - 100, size: 25 };
let obstacles = [];
let score = 0;
let speed = 2;

// INPUT
document.addEventListener("click", () => {
    if (gameState === "start" || gameState === "gameover") {
        startGame();
    } else {
        movePlayer();
    }
});

function movePlayer() {
    player.x += (Math.random() - 0.5) * 100;
}

// START GAME
function startGame() {
    gameState = "playing";
    score = 0;
    speed = 2;
    obstacles = [];
    player.x = canvas.width / 2;
}

// CREATE OBSTACLES
function spawnObstacle() {
    let x = Math.random() * canvas.width;
    obstacles.push({ x: x, y: 0, size: 20 });
}

// UPDATE GAME
function updateGame() {
    speed += 0.002;
    score++;

    if (Math.random() < 0.03) {
        spawnObstacle();
    }

    obstacles.forEach(o => {
        o.y += speed;

        // COLLISION
        if (
            player.x < o.x + o.size &&
            player.x + player.size > o.x &&
            player.y < o.y + o.size &&
            player.y + player.size > o.y
        ) {
            gameState = "gameover";
        }
    });

    obstacles = obstacles.filter(o => o.y < canvas.height);
}

// DRAW GAME
function drawGame() {
    // BACKGROUND GRADIENT
    let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, "#0f2027");
    gradient.addColorStop(1, "#000000");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === "start") {
        drawStartScreen();
        return;
    }

    if (gameState === "playing") {
        drawPlayer();
        drawObstacles();

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Score: " + score, 20, 30);
    }

    if (gameState === "gameover") {
        drawPlayer();
        drawObstacles();
        drawGameOver();
    }
}

// PLAYER
function drawPlayer() {
    ctx.shadowBlur = 20;
    ctx.shadowColor = "cyan";

    ctx.fillStyle = "cyan";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.shadowBlur = 0;
}

// OBSTACLES
function drawObstacles() {
    ctx.fillStyle = "red";
    obstacles.forEach(o => {
        ctx.fillRect(o.x, o.y, o.size, o.size);
    });
}

// START SCREEN
function drawStartScreen() {
    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "30px Arial";
    ctx.fillText("Axumit Runner", canvas.width / 2, canvas.height / 2 - 20);

    ctx.font = "20px Arial";
    ctx.fillText("Tap to Start", canvas.width / 2, canvas.height / 2 + 20);
}

// GAME OVER SCREEN
function drawGameOver() {
    ctx.fillStyle = "red";
    ctx.textAlign = "center";

    ctx.font = "30px Arial";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText("Tap to Restart", canvas.width / 2, canvas.height / 2 + 50);
}

// GAME LOOP
function gameLoop() {
    if (gameState === "playing") {
        updateGame();
    }

    drawGame();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
