<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Axumit Runner</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial;
    }

    /* 🎬 Intro */
    #splash {
      position: fixed;
      width: 100%;
      height: 100%;
      background: black;
      color: cyan;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      z-index: 9999;
    }

    /* 🎮 Player */
    #player {
      width: 40px;
      height: 40px;
      background: cyan;
      position: absolute;
      left: 50%;
      top: 80%;
    }

    /* 🔴 Blocks */
    .block {
      width: 40px;
      height: 40px;
      background: red;
      position: absolute;
      top: 0;
    }

    /* 📊 Score */
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <!-- 🎬 Intro screen -->
  <div id="splash">AXUMIT STUDIOS</div>

  <div id="player"></div>
  <div id="score">Score: 0 | High Score: 0</div>

  <script>
    const splash = document.getElementById("splash");
    const player = document.getElementById("player");
    const scoreText = document.getElementById("score");

    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;

    let playerX = window.innerWidth / 2 - 20;
    let playerY = window.innerHeight - 100;

    let gameStarted = false;
    let gameOver = false;

    let fallSpeed = 5;

    // 🎬 Start game
    setTimeout(() => {
      splash.style.display = "none";
      gameStarted = true;
    }, 2500);

    // 🎮 Keyboard controls (4 directions)
    document.addEventListener("keydown", (e) => {
      if (!gameStarted || gameOver) return;

      if (e.key === "ArrowLeft") playerX -= 30;
      if (e.key === "ArrowRight") playerX += 30;
      if (e.key === "ArrowUp") playerY -= 30;
      if (e.key === "ArrowDown") playerY += 30;

      playerX = Math.max(0, Math.min(window.innerWidth - 40, playerX));
      playerY = Math.max(0, Math.min(window.innerHeight - 40, playerY));

      player.style.left = playerX + "px";
      player.style.top = playerY + "px";
    });

    // 📱 Touch controls
    document.addEventListener("touchmove", (e) => {
      if (!gameStarted || gameOver) return;

      let x = e.touches[0].clientX;
      let y = e.touches[0].clientY;

      playerX = x - 20;
      playerY = y - 20;

      playerX = Math.max(0, Math.min(window.innerWidth - 40, playerX));
      playerY = Math.max(0, Math.min(window.innerHeight - 40, playerY));

      player.style.left = playerX + "px";
      player.style.top = playerY + "px";
    });

    // 🔴 Blocks
    function createBlock() {
      if (!gameStarted || gameOver) return;

      const block = document.createElement("div");
      block.classList.add("block");
      block.style.left = Math.random() * (window.innerWidth - 40) + "px";
      document.body.appendChild(block);

      let y = 0;

      let fall = setInterval(() => {
        if (gameOver) {
          clearInterval(fall);
          block.remove();
          return;
        }

        y += fallSpeed;
        block.style.top = y + "px";

        const p = player.getBoundingClientRect();
        const b = block.getBoundingClientRect();

        // 💥 Collision
        if (
          p.left < b.right &&
          p.right > b.left &&
          p.top < b.bottom &&
          p.bottom > b.top
        ) {
          gameOver = true;

          if (score > highScore) {
            highScore = score;
            localStorage.setItem("highScore", highScore);
          }

          alert("Game Over!\nScore: " + score + "\nHigh Score: " + highScore);
          location.reload();
        }

        // 📈 Score + difficulty
        if (y > window.innerHeight) {
          block.remove();
          clearInterval(fall);

          score++;
          scoreText.innerText =
            "Score: " + score + " | High Score: " + highScore;

          if (score % 5 === 0) {
            fallSpeed += 1;
          }
        }
      }, 20);
    }

    setInterval(createBlock, 900);
  </script>

</body>
</html>
